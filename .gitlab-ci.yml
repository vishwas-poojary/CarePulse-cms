stages:
  - lint
  - build

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

spellcheck:
  stage: lint
  script:
    - npm run spellcheck

build:
  stage: build
  variables:
    NODE_ENV: production
    DATABASE_URL: "mongodb://127.0.0.1:27017/carepulse-ci"
    PAYLOAD_SECRET: "ci-build-secret-placeholder-minimum-32-chars-long"
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH
